name: Datenbank

# Spielt neue Migrationen aus supabase/migrations nach dem Merge auf main ins Supabase-Projekt ein.
# Braucht die Repository-Secrets SUPABASE_ACCESS_TOKEN und SUPABASE_DB_PASSWORD.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/datenbank.yml"
  workflow_dispatch:

concurrency:
  group: datenbank
  cancel-in-progress: false

jobs:
  migrationen:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJEKT: mfjfhfbtmnwvvqernsun
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Secrets vorhanden?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secrets SUPABASE_ACCESS_TOKEN und SUPABASE_DB_PASSWORD fehlen (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - run: supabase link --project-ref "$PROJEKT"

      # 0001 wurde bei der Einrichtung von Hand im SQL-Editor eingespielt; als eingespielt markieren,
      # damit db push es nicht erneut ausführt. Mehrfaches Markieren ist unschädlich.
      - run: supabase migration repair 0001 --status applied

      - run: supabase db push
