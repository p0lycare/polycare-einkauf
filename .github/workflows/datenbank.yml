name: Datenbank

# Spielt neue Migrationen aus supabase/migrations nach dem Merge auf main ins Supabase-Projekt ein.
# Verbindet sich direkt über den Session-Pooler mit der Datenbank; braucht nur das Repository-Secret
# SUPABASE_DB_PASSWORD (kein Supabase-Zugriffstoken).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/datenbank.yml"
  workflow_dispatch:

concurrency:
  group: datenbank
  cancel-in-progress: false

jobs:
  migrationen:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJEKT: mfjfhfbtmnwvvqernsun
      # Session-Pooler (Supabase → Connect → Session pooler); GitHub-Runner erreichen die Datenbank nur darüber
      POOLER: aws-0-eu-west-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Verbindung vorbereiten
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD fehlt (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # Passwort für die URL kodieren, damit Sonderzeichen wie @ oder / nicht stören
          passwort=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$passwort"
          echo "DB_URL=postgresql://postgres.$PROJEKT:$passwort@$POOLER:5432/postgres" >> "$GITHUB_ENV"

      # 0001 wurde bei der Einrichtung von Hand im SQL-Editor eingespielt; als eingespielt markieren,
      # damit db push es nicht erneut ausführt. Mehrfaches Markieren ist unschädlich.
      - run: supabase migration repair 0001 --status applied --db-url "$DB_URL"

      - run: supabase db push --db-url "$DB_URL"
